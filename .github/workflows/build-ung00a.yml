# 编译 PonWrt 里 AN7581 平台的**全部**型号（不只是 UNG00A）
# 用法：放到 fork 出来的 ponwrt 仓库的 .github/workflows/ 下（建议文件名 build-an7581-all.yml）
#       然后在 Actions 页面点 Run workflow
#
# 关键改动（相对只编 UNG00A 的旧版）：
#   1. .config 直接用上游 configs/an7581.config（不改任何设备开关），即编译上游默认的全部设备；
#   2. 保留 bootloader 补丁（ung00a 补 ARTIFACT + 挂进 ATF/U-Boot 的 BUILD_DEVICES），
#      且改用「按行前缀插入」而不是依赖 DEVICE_PACKAGES 锚点，DEVICE_DTS 不在首行也能命中；
#   3. 顺手给 gemtek_xg2010g（AN7581 平台里唯一没有引导产物的型号）也补上 ARTIFACT，
#      让 12 个型号全部产出 preloader.bin + bl31-uboot.fip（该型号沿用 rfb 引导，需自测）；
#   4. 去掉「只允许 1 个设备」的断言，改为列出全部设备并输出数量；
#   5. 产物按型号分别上传（矩阵 + artifact-per-device），镜像生成失败的型号不影响其他型号；

name: Build PonWrt AN7581 (all devices)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-an7581-all
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 第一步：配置 + 下载 + 编译 + 打包（一次搞定，矩阵按设备分发）
  # ---------------------------------------------------------------------------
  build-all:
    name: Build firmware (an7581, all devices)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        device:
          - airoha_an7581-evb
          - airoha_an7581-evb-emmc-eagle
          - airoha_an7581-evb-emmc-kite
          - gemtek_w1700k-ubi
          - gemtek_xg2010g
          - fiberhome_hg5382a
          - fiberhome_hg5585f-ct
          - fiberhome_hg5585f-cu
          - fiberhome_hg5585f-ct-usb-sfp
          - fiberhome_hg5585f-cu-usb-sfp
          - znxt_zn515xg-d
          - znxt_zn504xg-d
          - nokia_valyrian
          - unionman_ung00a
          - h3c_hm2004-du
          - nokia_xg-040g-md-ubi
          - nokia_xg-040g-md-ubi-usb-sfp
          - nokia_xg-040g-tf-ubi
          - quantum_q1000k-ubi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Prepare signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          umask 077
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            echo "using repository signing key from secret"
          else
            openssl ecparam -name prime256v1 -genkey -noout -out private-key.pem
            echo "no secret found, generated a local signing key"
          fi
          openssl ec -in private-key.pem -pubout -out public-key.pem
          head -1 private-key.pem

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Restore missing libffi package
        run: |
          if [ -f package/libs/libffi/Makefile ]; then
            echo "libffi already present, nothing to do"
            exit 0
          fi
          echo "::warning::package/libs/libffi is missing in this repository, restoring it from immortalwrt"
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/immortalwrt/immortalwrt.git /tmp/imm
          git -C /tmp/imm sparse-checkout set package/libs/libffi
          cp -r /tmp/imm/package/libs/libffi package/libs/libffi
          test -f package/libs/libffi/Makefile
          echo "---- restored ----"

      - name: Patch bootloader artifacts (ung00a + gemtek_xg2010g + ATF/U-Boot BUILD_DEVICES)
        run: |
          set -e
          MK=target/linux/airoha/image/an7581.mk

          # ---- 1) 给 unionman_ung00a 补 ARTIFACT ----
          # 按行前缀插入，不依赖 DEVICE_PACKAGES 的具体内容/位置
          awk '
            /^define Device\/unionman_ung00a$/ { inblk=1 }
            inblk && !done && /^  DEVICE_DTS :=/ {
              print "  ARTIFACT/preloader.bin := an7581-preloader rfb"
              print "  ARTIFACT/bl31-uboot.fip := an7581-bl31-uboot rfb"
              print "  ARTIFACTS := preloader.bin bl31-uboot.fip"
              done=1
            }
            { print }
            inblk && /^endef$/ { inblk=0 }
          ' "$MK" > /tmp/an7581.mk.new && mv /tmp/an7581.mk.new "$MK"

          # ---- 2) gemtek_xg2010g 同样缺引导产物，一并补上（沿用 rfb 引导，需自行验证）----
          awk '
            /^define Device\/gemtek_xg2010g$/ { inblk=1 }
            inblk && !done && /^  DEVICE_DTS :=/ {
              print "  ARTIFACT/preloader.bin := an7581-preloader rfb"
              print "  ARTIFACT/bl31-uboot.fip := an7581-bl31-uboot rfb"
              print "  ARTIFACTS := preloader.bin bl31-uboot.fip"
              done=1
            }
            { print }
            inblk && /^endef$/ { inblk=0 }
          ' "$MK" > /tmp/an7581.mk.new && mv /tmp/an7581.mk.new "$MK"

          echo "==== patched ARTIFACT lines ===="
          grep -n "ARTIFACT" "$MK"
          test "$(grep -c 'ARTIFACT/preloader.bin' "$MK")" -ge 6 || {
            echo "ERROR: an7581.mk ARTIFACT patch failed"; exit 1; }
          grep -A 200 "^define Device/unionman_ung00a" "$MK" | \
            sed -n '1,/^endef/p' | grep -q "ARTIFACT/bl31-uboot.fip" || {
            echo "ERROR: unionman_ung00a ARTIFACT block not found"; exit 1; }

          # ---- 3) ung00a 挂到 an7581_rfb U-Boot 的 BUILD_DEVICES ----
          sed -i 's|^  BUILD_DEVICES:=airoha_an7581-evb airoha_an7581-evb-emmc-eagle airoha_an7581-evb-emmc-kite$|  BUILD_DEVICES:=airoha_an7581-evb airoha_an7581-evb-emmc-eagle airoha_an7581-evb-emmc-kite unionman_ung00a|' \
            package/boot/uboot-airoha/Makefile
          grep -q "BUILD_DEVICES:=.*unionman_ung00a" package/boot/uboot-airoha/Makefile || {
            echo "ERROR: uboot-airoha BUILD_DEVICES patch failed"; exit 1; }

          # ---- 4) ung00a 挂到 ATF an7581-bl2 / an7581-bl31 的 BUILD_DEVICES ----
          #      否则 ung00a 的 preloader/bl31 没有可用的 bl2.bin / bl31.lzma
          sed -i 's|^  BUILD_DEVICES:=airoha_an7581-evb airoha_an7581-evb-emmc-eagle airoha_an7581-evb-emmc-kite nokia_valyrian nokia_xg-040g-md-ubi$|  BUILD_DEVICES:=airoha_an7581-evb airoha_an7581-evb-emmc-eagle airoha_an7581-evb-emmc-kite nokia_valyrian nokia_xg-040g-md-ubi unionman_ung00a|' \
            package/boot/arm-trusted-firmware-airoha/Makefile
          n=$(grep -c "BUILD_DEVICES:=.*unionman_ung00a" package/boot/arm-trusted-firmware-airoha/Makefile)
          echo "ATF BUILD_DEVICES patched blocks: $n"
          [ "$n" -ge 2 ] || { echo "ERROR: ATF bl2/bl31 BUILD_DEVICES patch failed"; exit 1; }

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-an7581-all-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-an7581-all-
            ponwrt-dl-ung00a-

      - name: Configure all an7581 devices
        run: |
          # 直接使用上游默认配置（不改任何设备开关）→ 编译上游预置的全部 an7581 型号
          cp configs/an7581.config .config
          make defconfig
          echo "==== selected devices ====" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y" .config | sort | tee -a "$GITHUB_STEP_SUMMARY"
          count=$(grep -cE "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y" .config || true)
          echo "device count: $count" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$count" -ge 10 ] || { echo "ERROR: too few devices selected ($count)"; exit 1; }

      - name: Download sources
        run: make download -j8

      - name: Build firmware
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee /tmp/build-full.log | tail -n 3000

      - name: Verbose image-build retry on failure
        if: failure()
        continue-on-error: true
        run: |
          timeout 2400 make -j1 V=s target/linux/install > /tmp/verbose-fail.log 2>&1 || true
          tail -n 120 /tmp/verbose-fail.log

      - name: Dump failure info
        if: failure()
        run: |
          if [ -f /tmp/build-full.log ]; then
            {
              echo "## First error lines"
              echo '```'
              grep -n -m 12 -i -E "error:|Error [0-9]|No space left|Killed|out of memory|recipe for target|failed to build" /tmp/build-full.log || echo "(no match)"
              echo '```'
              echo "## Last 200 lines"
              echo '```'
              tail -n 200 /tmp/build-full.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            /tmp/build-full.log
            /tmp/verbose-fail.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Show result
        run: |
          ls -lh bin/targets/airoha/an7581/ || true
          du -sh bin/targets/airoha/an7581/ || true
          echo "==== images ====" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -1 bin/targets/airoha/an7581/ | grep -E '\.(itb|bin|fip)$' | sort | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Upload all firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-an7581-all
          path: |
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/*.bin
            bin/targets/airoha/an7581/*.fip
            bin/targets/airoha/an7581/profiles.json
            bin/targets/airoha/an7581/sha256sums
            bin/targets/airoha/an7581/*.manifest
            bin/targets/airoha/an7581/packages/**
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 第二步：按设备分发单个型号的产物（每个型号一个 artifact，方便单独下载）
  # ---------------------------------------------------------------------------
  split-artifacts:
    name: Pack ${{ matrix.device }}
    needs: build-all
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device:
          - airoha_an7581-evb
          - airoha_an7581-evb-emmc-eagle
          - airoha_an7581-evb-emmc-kite
          - gemtek_w1700k-ubi
          - gemtek_xg2010g
          - fiberhome_hg5382a
          - fiberhome_hg5585f-ct
          - fiberhome_hg5585f-cu
          - fiberhome_hg5585f-ct-usb-sfp
          - fiberhome_hg5585f-cu-usb-sfp
          - znxt_zn515xg-d
          - znxt_zn504xg-d
          - nokia_valyrian
          - unionman_ung00a
          - h3c_hm2004-du
          - nokia_xg-040g-md-ubi
          - nokia_xg-040g-md-ubi-usb-sfp
          - nokia_xg-040g-tf-ubi
          - quantum_q1000k-ubi

    steps:
      - name: Download all firmware
        uses: actions/download-artifact@v4
        with:
          name: ponwrt-an7581-all
          path: fw

      - name: Select device files
        run: |
          dev="${{ matrix.device }}"
          mkdir -p out
          shopt -s nullglob
          for f in fw/ponwrt-airoha-an7581-${dev}-*; do
            cp -v "$f" out/
          done
          cp -f fw/profiles.json fw/sha256sums out/ 2>/dev/null || true
          ls -lh out
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "WARNING: no image produced for ${dev}"; echo "empty" > out/README.txt
          fi

      - name: Upload ${{ matrix.device }}
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-an7581-${{ matrix.device }}
          path: out/*
          if-no-files-found: warn
          retention-days: 30
