# 只编译 PonWrt 的 Unionman UNG00A（AN7581）一个型号
# 用法：放到 fork 出来的 ponwrt 仓库的 .github/workflows/build-ung00a.yml
#       然后在 Actions 页面点 Run workflow

name: Build PonWrt UNG00A

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ung00a
  cancel-in-progress: false

jobs:
  build:
    name: Build an7581 / unionman_ung00a
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Prepare signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          umask 077
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            echo "using repository signing key from secret"
          else
            openssl ecparam -name prime256v1 -genkey -noout -out private-key.pem
            echo "no secret found, generated a local signing key"
          fi
          openssl ec -in private-key.pem -pubout -out public-key.pem
          head -1 private-key.pem

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Restore missing libffi package
        run: |
          if [ -f package/libs/libffi/Makefile ]; then
            echo "libffi already present, nothing to do"
            exit 0
          fi
          echo "::warning::package/libs/libffi is missing in this repository (upstream bug), restoring it from immortalwrt"
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/immortalwrt/immortalwrt.git /tmp/imm
          git -C /tmp/imm sparse-checkout set package/libs/libffi
          cp -r /tmp/imm/package/libs/libffi package/libs/libffi
          test -f package/libs/libffi/Makefile
          echo "---- restored ----"
          find package/libs/libffi -type f | head -20

      - name: Patch UNG00A bootloader artifacts (preloader.bin / bl31-uboot.fip)
        run: |
          # 1) 给 unionman_ung00a 设备定义补上 ARTIFACT（当前 master 源码只产出 itb，缺引导组件定义）
          sed -i '/^define Device\/unionman_ung00a/,/^endef/ s|^  DEVICE_PACKAGES := kmod-gpio-button-hotplug|  ARTIFACT/preloader.bin := an7581-preloader rfb\n  ARTIFACT/bl31-uboot.fip := an7581-bl31-uboot rfb\n  ARTIFACTS := preloader.bin bl31-uboot.fip\n  DEVICE_PACKAGES := kmod-gpio-button-hotplug|' \
            target/linux/airoha/image/an7581.mk
          grep -A 6 "ARTIFACT/preloader.bin" target/linux/airoha/image/an7581.mk | head -10
          grep -q "ARTIFACT/preloader.bin := an7581-preloader rfb" target/linux/airoha/image/an7581.mk || {
            echo "ERROR: failed to patch an7581.mk (ung00a ARTIFACT lines missing)"
            exit 1
          }
          # 2) 把 ung00a 挂到 an7581_rfb U-Boot 的 BUILD_DEVICES，确保只选 ung00a 时也会编译引导组件
          sed -i 's|BUILD_DEVICES:=airoha_an7581-evb airoha_an7581-evb-emmc-eagle airoha_an7581-evb-emmc-kite|BUILD_DEVICES:=airoha_an7581-evb airoha_an7581-evb-emmc-eagle airoha_an7581-evb-emmc-kite unionman_ung00a|' \
            package/boot/uboot-airoha/Makefile
          grep "BUILD_DEVICES.*unionman_ung00a" package/boot/uboot-airoha/Makefile || {
            echo "ERROR: failed to patch uboot-airoha/Makefile (BUILD_DEVICES not updated)"
            exit 1
          }

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-ung00a-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-ung00a-

      - name: Configure UNG00A only
        run: |
          ./scripts/kconfig.pl + configs/an7581.config configs/release.config > .config
          for dev in \
            fiberhome_hg5382a \
            fiberhome_hg5585f-ct \
            fiberhome_hg5585f-ct-usb-sfp \
            fiberhome_hg5585f-cu \
            fiberhome_hg5585f-cu-usb-sfp \
            gemtek_xg2010g \
            nokia_xg-040g-md-ubi \
            nokia_xg-040g-md-ubi-usb-sfp \
            nokia_xg-040g-tf-ubi \
            znxt_zn504xg-d \
            znxt_zn515xg-d
          do
            sed -i "s|^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_${dev}=y|# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_${dev} is not set|" .config
          done
          make defconfig
          echo "==== selected devices ===="
          grep -E "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y" .config
          count=$(grep -cE "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y" .config || true)
          if [ "$count" -ne 1 ]; then
            echo "ERROR: expected exactly 1 device, got $count"
            exit 1
          fi
          grep -E "^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y" .config | grep -q unionman_ung00a || {
            echo "ERROR: unionman_ung00a is not selected"
            exit 1
          }
          {
            echo "## Configure diagnostics"
            echo '```'
            echo "--- package/libs/libffi ---"
            ls -l package/libs/libffi || true
            echo "--- key symbols ---"
            grep -E "^CONFIG_PACKAGE_(python3|libffi)=" .config || echo "(neither python3 nor libffi selected)"
            echo "--- remaining libffi warnings ---"
            echo "(see log above)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q "^CONFIG_PACKAGE_python3=y" .config; then
            echo "python3 is enabled, libffi is required"
            if ! grep -q "^CONFIG_PACKAGE_libffi=y" .config; then
              echo "libffi missing -> forcing it on"
              sed -i 's/^# CONFIG_PACKAGE_libffi is not set/CONFIG_PACKAGE_libffi=y/' .config
              make defconfig
            fi
            grep -q "^CONFIG_PACKAGE_libffi=y" .config || {
              echo "ERROR: python3 is enabled but libffi still not selected"
              exit 1
            }
            echo "libffi: OK (python3 enabled -> libffi selected)"
          else
            echo "python3 not selected -> libffi not required, skipping assertion"
          fi

      - name: Download sources
        run: make download -j8

      - name: Build firmware
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee /tmp/build-full.log | tail -n 3000

      - name: Dump failure info
        if: failure()
        run: |
          if [ -f /tmp/build-full.log ]; then
            {
              echo "## First error lines"
              echo '```'
              grep -n -m 8 -i -E "error:|Error [0-9]|No space left|Killed|out of memory|recipe for target" /tmp/build-full.log || echo "(no match)"
              echo '```'
              echo "## Last 150 lines"
              echo '```'
              tail -n 150 /tmp/build-full.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Job failed before the build step started, no compile log available." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build-full.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Show result
        run: |
          ls -lh bin/targets/airoha/an7581/
          du -sh bin/targets/airoha/an7581/
          for f in \
            bin/targets/airoha/an7581/ponwrt-airoha-an7581-unionman_ung00a-preloader.bin \
            bin/targets/airoha/an7581/ponwrt-airoha-an7581-unionman_ung00a-bl31-u-boot.fip
          do
            [ -f "$f" ] || { echo "ERROR: bootloader artifact missing: $f"; ls -l bin/targets/airoha/an7581/; exit 1; }
          done
          echo "bootloader artifacts OK"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-an7581-unionman_ung00a
          path: |
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/*.bin
            bin/targets/airoha/an7581/*.fip
            bin/targets/airoha/an7581/profiles.json
            bin/targets/airoha/an7581/sha256sums
          if-no-files-found: error
          retention-days: 30
